# Broadcast-chain delays for the archive.org "Understanding 9/11" TV collection.
#
# Definition
# ----------
#   delay_s = (time the recorder saw it) - (time it happened)
# It is always >= 0 and is SUBTRACTED when turning an archive airtime into an
# event time:
#
#   t_event = item.start_time + media_offset - delay_s
#
# It covers everything between the lens and the capture station's encoder:
# the live remote link (helicopter microwave, ENG truck), network switching,
# any satellite hop, and -- the big one -- MPEG-2 encode/decode latency on a
# DBS receiver.
#
# How to read the numbers
# -----------------------
# `verified: true` means the entry was measured against a NIST NCSTAR 1 anchor
# in footage; `verified: false` means it is an engineering estimate and the
# sigma is deliberately wide.  Do not narrow a sigma without adding evidence.
#
# The measurement uncertainty of any such calibration is floored by the anchor
# itself: NIST gives the impacts to +-5 s and the collapse initiations to +-2 s
# (see wtc4d/timeline.py), so a single-anchor calibration cannot claim better.
#
# Lookup order (wtc4d.sync.broadcast.ChannelDelays.for_channel):
#   channels[<CHANNEL>]  ->  reception[<antenna|satellite|cable>]  ->  default
# The reception path is parsed from the item's own `source` metadata field,
# e.g. "Antenna > FutureTel NS320 > ..." or "DISH Network > FutureTel NS320 > ...".

notes: >
  Entries below apply to the Bowie, MD capture station of the Internet Archive
  TV News Archive, which is what the collection:911 items came from.  A
  different recorder (a home VHS off a cable headend, a network's own master
  tape) has a different chain and must not reuse these numbers.

default:
  delay_s: 1.5
  sigma_s: 2.0
  verified: false
  evidence: >
    Unknown reception path.  Centred between an off-air capture (sub-second)
    and a DBS capture (1-3 s), with a sigma wide enough to cover both.

reception:
  antenna:
    delay_s: 0.3
    sigma_s: 0.5
    verified: false
    evidence: >
      Off-air analog NTSC from a local transmitter.  The only latency is the
      station's own live chain (ENG microwave/truck link, production switcher,
      frame synchroniser): a few frames to a few hundred milliseconds in 2001,
      with no digital compression anywhere in the path.

  satellite:
    delay_s: 2.0
    sigma_s: 1.5
    verified: false
    evidence: >
      DBS (DISH Network) reception.  Geostationary propagation up+down is only
      ~0.24 s; the rest is 2001-era MPEG-2 statistical-multiplex encoding at
      the uplink plus the set-top decoder buffer, typically 1-2 s combined.

  cable:
    delay_s: 0.5
    sigma_s: 1.0
    verified: false
    evidence: >
      Analog cable headend redistribution of an off-air or fibre feed; the
      headend itself adds little, but a satellite-fed superstation on the same
      headend would not, so the sigma stays wide.

channels:
  CNN:
    delay_s: 5.8
    sigma_s: 4.0
    verified: true
    evidence: >
      Measured on CNN_20010911_130000_CNN_Live_This_Morning (captured from
      DISH Network per its `source` field).  The UA175 fireball on the WABC
      NewsCopter 7 shot carried live by CNN is detected by
      wtc4d.sync.events.detect_impact_flash at media offset 184.8 s, i.e.
      archive airtime 09:03:04.8 EDT, against the NIST NCSTAR 1 impact time
      of 09:02:59 (+-5 s) -- a +5.8 s difference.  That is on the high side
      for the DBS chain alone (see the `satellite` reception entry above);
      plausibly this WABC shot reached CNN as a several-second-delayed relay
      rather than strictly live, which this single measurement cannot
      separate from encoder/relay latency.  The sigma is widened accordingly
      and is not tight enough to treat this number as more than an
      order-of-magnitude check -- see "Validation" in wtc4d/sync/README.md
      for the full derivation and caveats.

  # Channels captured off-air by the same station.  Listed explicitly so that
  # a future measurement has somewhere to land; until then they resolve to the
  # `antenna` reception entry anyway.
  WUSA: {delay_s: 0.3, sigma_s: 0.5, verified: false, evidence: "CBS affiliate, Washington DC; off-air (Antenna) capture."}
  WRC:  {delay_s: 0.3, sigma_s: 0.5, verified: false, evidence: "NBC owned-and-operated, Washington DC; off-air capture."}
  WJLA: {delay_s: 0.3, sigma_s: 0.5, verified: false, evidence: "ABC affiliate, Washington DC; off-air capture."}
  WTTG: {delay_s: 0.3, sigma_s: 0.5, verified: false, evidence: "Fox owned-and-operated, Washington DC; off-air capture."}
